[project]
name = "opencs-web"
version = "0.1.0"
description = "The web site for an OpenCS server: status, registration, administration and recordings"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mark Quinn" }]
requires-python = ">=3.12"
# The web process's dependencies live here, never in the server's pyproject.toml (ADR 1, ADR 12).
dependencies = ["opencs", "django>=5.2", "uvicorn>=0.30"]

[project.scripts]
opencs-web = "opencs_web.__main__:main"

[tool.uv.sources]
opencs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencs_web"]

# Ruff takes its settings from the root pyproject.toml. pytest and mypy have their own here, run from
# the repository root as `uv run pytest web` and `uv run mypy --config-file web/pyproject.toml`.

[tool.mypy]
strict = true
python_version = "3.12"
files = ["web/src", "web/tests"]
mypy_path = ["web/tests"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "testsettings"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
DJANGO_SETTINGS_MODULE = "testsettings"
tmp_path_retention_policy = "failed"
