[project]
name = "opencs-web"
version = "0.1.0"
description = "The web site for an OpenCS server: status, registration, administration and recordings"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mark Quinn" }]
requires-python = ">=3.12"
# The web process's dependencies live here, never in the server's pyproject.toml (ADR 1, ADR 12).
dependencies = [
    "opencs",
    "django>=5.2",
    "uvicorn>=0.30",
    "django-otp>=1.6",
]

[project.scripts]
opencs-web = "opencs_web.__main__:main"

[dependency-groups]
# Only for web/benchmarks/compression.py, which compares compressors for the recording archive:
# `uv run --package opencs-web --group benchmark python web/benchmarks/compression.py ...`.
benchmark = ["zstandard>=0.23", "lz4>=4.3", "brotli>=1.1"]

[tool.uv.sources]
opencs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencs_web"]

# Ruff takes its settings from the root pyproject.toml. pytest and mypy have their own here, run from
# the repository root as `uv run pytest web` and `uv run mypy --config-file web/pyproject.toml`.

[tool.mypy]
strict = true
python_version = "3.12"
files = ["web/src", "web/tests", "web/benchmarks"]
mypy_path = ["web/tests"]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
# The benchmark group's compressors: not installed by a plain `uv sync`, and lz4 and brotli are untyped.
module = ["brotli", "lz4", "lz4.*", "zstandard"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# django-otp ships no type information.
module = ["django_otp", "django_otp.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "testsettings"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
DJANGO_SETTINGS_MODULE = "testsettings"
tmp_path_retention_policy = "failed"
