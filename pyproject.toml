[project]
name = "opencs"
version = "1.0.0rc2"
description = "A server compatible with the 1993 online game CyberStrike"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mark Quinn" }]
keywords = ["game-server", "serial", "dosbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Framework :: AsyncIO",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
requires-python = ">=3.12"
dependencies = ["argon2-cffi>=23.1"]

[project.urls]
Homepage = "https://github.com/mmq/opencs-server"
Source = "https://github.com/mmq/opencs-server"
Changelog = "https://github.com/mmq/opencs-server/blob/main/CHANGELOG.md"
Issues = "https://github.com/mmq/opencs-server/issues"
Specification = "https://github.com/mmq/cyberstrike-spec/tree/v1.0"

[project.scripts]
opencs = "opencs.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencs"]

[dependency-groups]
# opencs-web (web/) is a workspace member in the dev group only, so `uv sync --no-dev` installs the
# server and argon2-cffi alone (tests/unit/test_dependencies.py).
dev = ["pytest", "ruff", "mypy", "opencs-web", "pytest-django>=4.9", "django-stubs>=5.2"]

[tool.uv.workspace]
members = ["web"]

[tool.uv.sources]
opencs-web = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "web/src", "web/tests"]
extend-exclude = ["docs"]  # prose with code samples, not code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PL"]
ignore = ["PLR2004"]  # magic-value comparisons: protocol code compares against spec constants

[tool.ruff.lint.per-file-ignores]
# Django writes the migrations; their class attributes are lists by its convention.
"web/src/opencs_web/migrations/*" = ["RUF012"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# The web package's tests run on their own, with its settings: `uv run pytest web`.
addopts = "-ra --strict-markers -m 'not judge' -p no:django"
# A passing test's tmp_path is removed at the end of the run; a failing one's is kept to inspect.
tmp_path_retention_policy = "failed"
markers = [
    "e2e: starts a server subprocess",
    "judge: runs in real time, tools/judge.py against a server it starts and what must be timed on a real clock; deselected by default, run with -m judge",
]
