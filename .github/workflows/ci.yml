name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch or pull request cancels the run it replaces; every run on main finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the project supports and the newest, on Linux; macOS on the newest.
        os: [ubuntu-latest]
        python: ["3.12", "3.15"]
        include:
          - os: macos-latest
            python: "3.15"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Web checks (web/)
        run: |
          uv run mypy --config-file web/pyproject.toml
          uv run pytest web
      - name: The server alone installs only argon2-cffi
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/server-only" uv sync --locked --no-dev
          installed=$(uv pip list --python "$RUNNER_TEMP/server-only/bin/python" --format json \
            | python3 -c 'import json, sys; print(" ".join(sorted(p["name"] for p in json.load(sys.stdin))))')
          echo "$installed"
          test "$installed" = "argon2-cffi argon2-cffi-bindings cffi opencs pycparser"
      - name: Both packages build (sdist and wheel)
        run: uv build --all-packages --out-dir "$RUNNER_TEMP/dist"

  smoke:
    name: Smoke test (the 19 judge checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: tools/smoke.sh
